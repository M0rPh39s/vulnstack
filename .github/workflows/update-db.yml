name: Update vulnerability database

# Builds the VulnStack database from NVD and publishes it to the `db-latest`
# release, which `vulnstack db update` downloads from.
#
# One-time setup: add the repository secret NVD_API_KEY (free from
# https://nvd.nist.gov/developers/request-an-api-key). To seed the very first
# database with history, run this workflow manually: leave "full" unticked and
# set "backfill_years" (default 6) to pull older CVEs by publication date. Once
# seeded, scheduled runs start from the previously published database, so the
# history persists without re-crawling it. Ticking "full" instead crawls the
# entire NVD corpus; if that does not fit in GitHub's 6-hour job limit, seed it
# from a local machine (see "Publishing the database" in the README).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild from scratch with a full NVD crawl (slow)"
        type: boolean
        default: false
      backfill_years:
        description: "Also backfill CVEs published in the last N years (0 = skip). Run once to seed history into the published DB."
        type: string
        default: "6"

permissions:
  contents: write   # create/update the db-latest release

concurrency:
  group: update-db
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'M0rPh39s/vulnstack'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Choose database location
        # The `runner` context is not available in job-level `env`.
        run: echo "VULNSTACK_DATABASE=$RUNNER_TEMP/vulnstack.db" >> "$GITHUB_ENV"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start from the previously published database
        if: ${{ !inputs.full }}
        continue-on-error: true   # nothing published yet on the very first run
        run: vulnstack db update

      - name: Fetch new records from NVD
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            vulnstack db update --source nvd --full
          else
            vulnstack db update --source nvd --bootstrap-days 7
          fi

      # Seed older CVEs by publication date. Only on manual runs: once the
      # history is in the published database, every scheduled run starts from
      # that database (see "Start from the previously published database"), so
      # the old records persist without re-crawling them each day.
      - name: Backfill historical CVEs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_years != '0' && inputs.backfill_years != '' }}
        run: vulnstack db update --source nvd --years "${{ inputs.backfill_years }}"

      - name: Build release files
        run: vulnstack db publish --out dist

      - name: Publish
        run: |
          gh release view db-latest >/dev/null 2>&1 || gh release create db-latest \
            --title "Vulnerability database" --latest=false \
            --notes "Automatically built from the NVD (https://nvd.nist.gov). This product uses the NVD API but is not endorsed or certified by the NVD. Downloaded by 'vulnstack db update'."
          # Data files first, manifest last: clients never see a manifest that
          # points at files which are not there yet.
          gh release upload db-latest dist/vulnstack-db-full.sqlite.gz dist/vulnstack-db-delta.jsonl.gz --clobber
          gh release upload db-latest dist/manifest.json --clobber
