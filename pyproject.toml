[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnstack"
version = "0.1.0"
description = "Non-AI website technology fingerprinting and known-vulnerability correlation tool for Debian-based Linux."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "M0rPh39s", email = "ghassenboulares7@gmail.com" }]
keywords = ["security", "cve", "fingerprinting", "vulnerability", "nvd", "scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rich>=13.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "responses>=0.24",
]

[project.urls]
Homepage = "https://github.com/M0rPh39s/vulnstack"
Repository = "https://github.com/M0rPh39s/vulnstack"

[project.scripts]
vulnstack = "vulnstack.cli:main"

[tool.setuptools.packages.find]
include = ["vulnstack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
